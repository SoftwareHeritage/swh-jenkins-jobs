- project:
    name: DDOC
    display-name: swh-docs
    jobs:
      - "{name}"
      - "{name}/publish"
      - "{name}/dev"
      - "{name}/builds"

- job-template: &sphinx_builds
    name: "{name}/builds"
    display_name: GitLab builds
    project-type: pipeline
    docker_image: sphinx
    sphinx_basepython: py311
    concurrent: true
    sandbox: true
    publish: false
    sphinx_opts: -W -T --jobs auto --keep-going -w errors.log
    tox_env: sphinx-dev
    properties:
      - build-discarder:
          days-to-keep: 20
      - gitlab:
          connection: "{gitlab_connection_name}"
    triggers:
      - gitlab:
          trigger-push: true
          trigger-merge-request: true
          trigger-open-merge-request-push: source
          trigger-only-if-new-commits-pushed: true
          trigger-note: true
          note-regex: "@jenkins.*retry.*build"
          wip-skip: false
          add-ci-message: true
          cancel-pending-builds-on-update: true
          # secret jenkins token is generated when executing tox
          secret-token: !include-raw-verbatim: jobs/templates/jenkins-token
    dsl: !include-jinja2: templates/swh-docs-pipeline.groovy.j2


- job-template:
    name: "{name}/publish"
    description: Build the documentation and publish it
    triggers: !j2-yaml: |
      {% if production_jenkins %}
      - timed: "@daily"
      {% else %}
      []
      {% endif %}
    publish: true
    sphinx_opts:
    tox_env: sphinx
    <<: *sphinx_builds

- job-template:
    name: "{name}/dev"
    description: Build the documentation from git repos
    triggers: !j2-yaml: |
      {% if production_jenkins %}
      - timed: "H 9-22/2 * * *"
      {% else %}
      []
      {% endif %}
    <<: *sphinx_builds